name: Publish Legacy Crate (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

jobs:
  publish-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/gpui-query-legacy -> target"

      - name: Verify version matches tag
        working-directory: crates/gpui-query-legacy
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${{ github.event.inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION, tag has $TAG_VERSION"
            exit 1
          fi
          echo "Publishing gpui-query-legacy v$VERSION"

      - name: Publish legacy crate to crates.io
        working-directory: crates/gpui-query-legacy
        run: cargo publish || echo "Already published, continuing."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
