name: Publish Legacy Crate (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

jobs:
  publish-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/gpui-query-legacy -> target"

      - name: Verify version matches tag
        working-directory: crates/gpui-query-legacy
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gpui-query-legacy") | .version')
          TAG_VERSION="${{ github.event.inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION, tag has $TAG_VERSION"
            exit 1
          fi
          echo "Publishing gpui-query-legacy v$VERSION"

      - name: Publish legacy crate to crates.io
        working-directory: crates/gpui-query-legacy
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${TAG_INPUT#v}"
          set +e
          out=$(cargo publish 2>&1)
          status=$?
          printf '%s\n' "$out"
          # Only a duplicate-version rejection is safe to swallow; cargo's
          # wording differs by version ("already uploaded", "already exists
          # on crates.io index").
          if [ "$status" -ne 0 ] && ! printf '%s\n' "$out" | grep -Eq "already uploaded|already exists on crates.io"; then
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            for _ in $(seq 12); do
              if curl -fsSL --max-time 30 "https://index.crates.io/gp/ui/gpui-query-legacy" | grep -q "\"vers\":\"$VERSION\""; then
                exit 0
              fi
              sleep 10
            done
            echo "crates.io rejected v$VERSION as a duplicate but it never landed on the index"
            exit 1
          fi
