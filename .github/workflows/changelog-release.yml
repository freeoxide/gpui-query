name: Changelog Release

on:
  push:
    branches: [master]
    paths:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.exists == 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version from CHANGELOG
        id: changelog
        run: |
          VERSION=$(grep -m 1 -oP '\[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git tag -l | grep -q "^${{ steps.changelog.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        id: notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          NOTES=$(awk "/\[${VERSION}\]/,/^## \[([0-9]+\.){2}[0-9]+\]/" CHANGELOG.md | head -n -1 | tail -n +2 | sed '/^$/d; 1{/^$/d}')
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml versions
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/gpui-query/Cargo.toml

      - name: Commit version bump
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/gpui-query/Cargo.toml
          git diff --cached --quiet || git commit -m "chore: bump gpui-query version to v${{ steps.changelog.outputs.version }}"

      - name: Create Git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.changelog.outputs.tag }}" -m "Release v${{ steps.changelog.outputs.version }}"

      - name: Push tag and commit
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git push origin HEAD:${{ github.ref }}
          git push origin "${{ steps.changelog.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, '-') }}

  publish-main:
    needs: check-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/gpui-query -> target"

      - name: Verify version
        working-directory: crates/gpui-query
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Publishing gpui-query v$VERSION"

      - name: Publish main crate
        working-directory: crates/gpui-query
        run: cargo publish || echo "Already published, continuing."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-web:
    needs: publish-main
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=gpui-query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
