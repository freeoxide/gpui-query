name: Changelog Release

on:
  push:
    branches: [master]
    paths:
      - 'CHANGELOG.md'

concurrency:
  group: changelog-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.exists == 'false' }}
      should_publish: ${{ steps.check_crates.outputs.published == 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version from CHANGELOG
        id: changelog
        run: |
          VERSION=$(grep -m 1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(?=\])' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1
          status=$?
          set -e
          case $status in
            0) exists=true ;;
            2) exists=false ;;
            *)
              echo "git ls-remote failed with exit $status"
              exit "$status"
              ;;
          esac
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Check if the version is on crates.io
        id: check_crates
        # The tag is cut before `cargo publish` runs, so tag-exists does not
        # imply published (v0.3.0 tagged, publish broke). Retry on the registry.
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          index=$(curl -fsSL --max-time 30 --retry 3 "https://index.crates.io/gp/ui/gpui-query") || { echo "crates.io index fetch failed"; exit 1; }
          if printf '%s' "$index" | grep "\"vers\":\"$VERSION\"" | grep -q '"yanked":false'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          newest=$(printf '%s' "$index" | grep -oP '"vers":"\K[^"]+' | sort -V | tail -1)
          lowest=$(printf '%s\n%s\n' "$VERSION" "$newest" | sort -V | head -1)
          if [ "$lowest" = "$VERSION" ] && [ "$VERSION" != "$newest" ]; then
            echo "CHANGELOG head $VERSION is below registry newest $newest; refusing to downgrade"
            exit 1
          fi
          stranded=""
          while read -r v; do
            if [ "$v" = "$VERSION" ]; then continue; fi
            git ls-remote --exit-code origin "refs/tags/v$v" >/dev/null 2>&1 || continue
            if ! printf '%s' "$index" | grep -q "\"vers\":\"$v\""; then
              echo "Tagged v$v is missing from crates.io; recover it with: just publish v$v"
              stranded=1
            fi
          done < <(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          if [ -n "$stranded" ]; then
            exit 1
          fi

      - name: Extract release notes
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          awk -v h="## [${VERSION}]" 'index($0, h) == 1 {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"

      - name: Update Cargo.toml versions
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/gpui-query/Cargo.toml
          grep -q "^version = \"$VERSION\"" crates/gpui-query/Cargo.toml || { echo "main version sed did not match"; exit 1; }
          # Keep the version literal in sync across the install snippets that
          # external systems render statically (crates.io README, GitHub README,
          # docs installation and persistence pages, skill docs, AGENTS.md).
          # Mirrors the Cargo.toml bump above: bare and table `version = "x.y.z"`
          # forms plus the prose forms `gpui-query (vx.y.z)`, `gpui-query` vx.y.z,
          # and `main crate (vx.y.z)`. Each pattern anchors on `gpui-query` or
          # `main crate`, so the -http and -persist satellite pins are untouched.
          sed -i -E \
            -e 's|gpui-query = "[^"]*"|gpui-query = "'"$VERSION"'"|g' \
            -e 's|gpui-query = [{] version = "[^"]*"|gpui-query = { version = "'"$VERSION"'"|g' \
            -e 's|gpui-query \(v[0-9]+\.[0-9]+\.[0-9]+\)|gpui-query (v'"$VERSION"')|g' \
            -e 's|gpui-query` v[0-9]+\.[0-9]+\.[0-9]+|gpui-query` v'"$VERSION"'|g' \
            -e 's|main crate \(v[0-9]+\.[0-9]+\.[0-9]+\)|main crate (v'"$VERSION"')|g' \
            README.md \
            crates/gpui-query/README.md \
            web/src/content/docs/docs/getting-started/installation.mdx \
            web/src/content/docs/docs/guides/persistence.mdx \
            skills/gpui-query/SKILL.md \
            skills/gpui-query-extensions/SKILL.md \
            AGENTS.md
          # The satellites pin `gpui-query` by major.minor; a minor release
          # must move that req or path+version resolution stops matching.
          MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          sed -i -E "s|(gpui-query = [{] path = \"\.\./gpui-query\", version = \")[^\"]+|\1${MINOR}|" \
            crates/gpui-query-http/Cargo.toml \
            crates/gpui-query-persist/Cargo.toml
          for f in crates/gpui-query-http/Cargo.toml crates/gpui-query-persist/Cargo.toml; do
            grep -q "path = \"../gpui-query\", version = \"$MINOR\"" "$f" || { echo "satellite req sync missed $f"; exit 1; }
          done

      - name: Commit version bump
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/gpui-query/Cargo.toml crates/gpui-query-http/Cargo.toml crates/gpui-query-persist/Cargo.toml README.md crates/gpui-query/README.md web/src/content/docs/docs/getting-started/installation.mdx web/src/content/docs/docs/guides/persistence.mdx skills/gpui-query/SKILL.md skills/gpui-query-extensions/SKILL.md AGENTS.md
          git diff --cached --quiet || git commit -m "chore: bump gpui-query version to v${{ steps.changelog.outputs.version }}"

      - name: Create Git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.changelog.outputs.tag }}" -m "Release v${{ steps.changelog.outputs.version }}"

      - name: Push tag and commit
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git push --atomic origin HEAD:${{ github.ref }} "${{ steps.changelog.outputs.tag }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            body=$(gh release view "$TAG" --json body -q .body)
            if [ -n "$body" ]; then
              exit 0
            fi
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            args=(--title "Release $TAG" --notes-file "$RUNNER_TEMP/notes.md")
            case "$VERSION" in
              *-*) args+=(--prerelease) ;;
            esac
            gh release create "$TAG" "${args[@]}"
          fi

  publish-main:
    needs: check-and-release
    # Runs while the CHANGELOG's newest version is missing from crates.io —
    # first attempt or retry after a failed publish — and skips once it lands.
    if: needs.check-and-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      # Tags cut before the release-bump sync carry a stale satellite req
      # (v0.3.0) that breaks workspace resolution before the libc pin can run.
      - name: Sync satellite reqs with the tagged version
        run: |
          MINOR="$(cut -d. -f1-2 <<<"${{ needs.check-and-release.outputs.version }}")"
          sed -i -E "s|(gpui-query = [{] path = \"\.\./gpui-query\", version = \")[^\"]+|\1${MINOR}|" \
            crates/gpui-query-http/Cargo.toml \
            crates/gpui-query-persist/Cargo.toml

      # xattr 0.2.3 (via gpui -> zed-async-tar) references libc::ENOATTR,
      # removed on Linux in libc 0.2.190; drop once zed-async-tar moves off xattr 0.2.x.
      - name: Pin libc below the ENOATTR removal
        run: cargo update -p libc --precise 0.2.189

      # No `workspaces` override: the repo root is the workspace root and
      # rust-cache resolves the default "." against GITHUB_WORKSPACE, not the
      # job's working-directory — the old "crates/gpui-query -> target"
      # mapping cached a directory cargo never writes. The working-directory
      # on the run steps below is unaffected.
      - uses: Swatinem/rust-cache@v2

      - name: Verify version
        working-directory: crates/gpui-query
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gpui-query") | .version')
          EXPECTED="${{ needs.check-and-release.outputs.version }}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "Version mismatch: tagged tree has $VERSION, CHANGELOG says $EXPECTED"
            exit 1
          fi
          echo "Publishing gpui-query v$VERSION"

      - name: Publish main crate
        working-directory: crates/gpui-query
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check-and-release.outputs.version }}
        run: |
          set +e
          out=$(cargo publish 2>&1)
          status=$?
          printf '%s\n' "$out"
          # Only crates.io's "already uploaded" rejection is safe to swallow.
          if [ "$status" -ne 0 ] && ! printf '%s\n' "$out" | grep -q "already uploaded"; then
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            for _ in $(seq 12); do
              if curl -fsSL --max-time 30 "https://index.crates.io/gp/ui/gpui-query" | grep -q "\"vers\":\"$VERSION\""; then
                exit 0
              fi
              sleep 10
            done
            echo "crates.io claimed already uploaded but v$VERSION never landed on the index"
            exit 1
          fi

      - name: Wait for the main crate on the index
        env:
          VERSION: ${{ needs.check-and-release.outputs.version }}
        run: |
          for _ in $(seq 12); do
            if curl -fsSL --max-time 30 "https://index.crates.io/gp/ui/gpui-query" | grep -q "\"vers\":\"$VERSION\""; then
              exit 0
            fi
            sleep 10
          done
          echo "gpui-query v$VERSION did not appear on the crates.io index"
          exit 1

      - name: Publish satellite crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          for crate in gpui-query-http gpui-query-persist; do
            v=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if curl -fsSL --max-time 30 "https://index.crates.io/gp/ui/$crate" | grep -q "\"vers\":\"$v\""; then
              echo "$crate v$v is already on the index"
              continue
            fi
            out=$(cd "crates/$crate" && cargo publish 2>&1)
            status=$?
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ] && ! printf '%s\n' "$out" | grep -q "already uploaded"; then
              exit "$status"
            fi
            ok=""
            for _ in $(seq 12); do
              if curl -fsSL --max-time 30 "https://index.crates.io/gp/ui/$crate" | grep -q "\"vers\":\"$v\""; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "$crate v$v never landed on the crates.io index"
              exit 1
            fi
          done

  deploy-web:
    needs: [publish-main, check-and-release]
    # The site must never advertise a version crates.io lacks: deploy only
    # after a successful publish, or when the version was already published
    # and this run re-cut the tag.
    if: ${{ !cancelled() && needs.check-and-release.result == 'success' && (needs.publish-main.result == 'success' || (needs.publish-main.result == 'skipped' && needs.check-and-release.outputs.should_release == 'true')) }}
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: web

    steps:
      # Check out the tagged commit (created by check-and-release) so the web
      # build sees the version-bumped Cargo.toml — read at build time by the OG
      # image and changelog page — and the synced markdown install snippets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=gpui-query --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
