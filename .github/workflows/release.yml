name: Publish Crate (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1 || { echo "Tag '$TAG' not found on the remote"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      # Tags cut before the release-bump sync carry a stale satellite req
      # (v0.3.0) that breaks workspace resolution before the libc pin can run.
      - name: Sync satellite reqs with the tagged version
        run: |
          VERSION="$(grep -m1 '^version' crates/gpui-query/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          MINOR="$(cut -d. -f1-2 <<<"$VERSION")"
          sed -i -E "s|(gpui-query = [{] path = \"\.\./gpui-query\", version = \")[^\"]+|\1${MINOR}|" \
            crates/gpui-query-http/Cargo.toml \
            crates/gpui-query-persist/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      # xattr 0.2.3 (via gpui -> zed-async-tar) references libc::ENOATTR,
      # removed on Linux in libc 0.2.190; drop once zed-async-tar moves off xattr 0.2.x.
      - name: Pin libc below the ENOATTR removal
        run: cargo update -p libc --precise 0.2.189

      # No `workspaces` override: the repo root is the workspace root and
      # rust-cache resolves the default "." against GITHUB_WORKSPACE, not the
      # job's working-directory — the old "crates/gpui-query -> target"
      # mapping cached a directory cargo never writes. The working-directory
      # on the run steps below is unaffected.
      - uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        working-directory: crates/gpui-query
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gpui-query") | .version')
          TAG_VERSION="${TAG_INPUT#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION, tag has $TAG_VERSION"
            exit 1
          fi
          echo "Publishing gpui-query v$VERSION"

      - name: Publish main crate to crates.io
        working-directory: crates/gpui-query
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${TAG_INPUT#v}"
          set +e
          out=$(cargo publish 2>&1)
          status=$?
          printf '%s\n' "$out"
          # Only crates.io's "already uploaded" rejection is safe to swallow.
          if [ "$status" -ne 0 ] && ! printf '%s\n' "$out" | grep -q "already uploaded"; then
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            for _ in $(seq 12); do
              if curl -fsSL --max-time 30 "https://index.crates.io/gp/ui/gpui-query" | grep -q "\"vers\":\"$VERSION\""; then
                exit 0
              fi
              sleep 10
            done
            echo "crates.io claimed already uploaded but v$VERSION never landed on the index"
            exit 1
          fi

  deploy-web:
    runs-on: ubuntu-latest
    needs: publish-main
    environment: prod
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=gpui-query --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
