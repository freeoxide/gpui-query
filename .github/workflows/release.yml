name: Publish Crate

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/gpui-query -> target\ncrates/gpui-query-v2 -> target"

      - name: Determine which crate to publish
        id: crate
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == *"-v2"* ]] || [[ "$TAG" == *"v2"* ]]; then
            echo "name=crates/gpui-query-v2" >> "$GITHUB_OUTPUT"
            echo "pkg=gpui-query-v2" >> "$GITHUB_OUTPUT"
          else
            echo "name=crates/gpui-query" >> "$GITHUB_OUTPUT"
            echo "pkg=gpui-query" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version matches tag
        working-directory: ${{ steps.crate.outputs.name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          TAG_VERSION="${TAG_VERSION%-v2}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION, tag has $TAG_VERSION"
            exit 1
          fi
          echo "Publishing ${{ steps.crate.outputs.pkg }} v$VERSION"

      - name: Publish to crates.io
        working-directory: ${{ steps.crate.outputs.name }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-website:
    runs-on: ubuntu-latest
    needs: publish
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: web
          command: pages deploy dist/client --project-name=gpui-query
