[package]
name = "gpui-query"
version = "0.2.0"
edition = "2024"
description = "TanStack Query-inspired async state management for GPUI"
repository = "https://github.com/hmziqrs/gpui-query"
readme = "README.md"
license = "MIT"
keywords = ["gpui", "async", "state-management", "query", "zed"]
categories = ["asynchronous", "caching", "gui"]
homepage = "https://gpui-query.hmziq.xyz"
authors = ["hmziqrs"]

[features]
default = ["client"]
core = []
client = ["core", "dep:gpui"]
hook = ["client"]
persist = ["client", "hook", "dep:serde_json", "dep:thiserror"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
ahash = { version = "0.8" }
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
