[package]
name = "gpui-query"
version = "0.1.1"
edition = "2024"
description = "TanStack Query-inspired async state management for GPUI"
repository = "https://github.com/hmziqrs/gpui-query"
license = "MIT"
keywords = ["gpui", "async", "state-management", "query", "zed"]
categories = ["asynchronous", "caching", "gui"]
homepage = "https://gpui-query.hmziq.xyz"

[features]
default = ["client"]
core = []
client = ["core", "dep:gpui"]
hook = ["client"]
legacy = ["dep:gpui-query-legacy"]

[dependencies]
serde = { workspace = true }
ahash = { version = "0.8" }
gpui = { workspace = true, optional = true }
gpui-query-legacy = { path = "../gpui-query-legacy", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
proptest = "1"
