[package]
name = "gpui-query-v2"
version = "0.1.0"
edition = "2024"
description = "TanStack Query-inspired async state management for GPUI (v2 rewrite)"
repository = "https://github.com/hmziqrs/gpui-query"
license = "MIT OR Apache-2.0"
keywords = ["gpui", "async", "state-management", "query", "zed"]
categories = ["asynchronous", "caching", "gui"]
homepage = "https://gpui-query.hmziq.xyz"

[features]
default = ["client"]
core = []
client = ["core", "dep:gpui"]
hook = ["client"]

[dependencies]
serde = { workspace = true }
ahash = { version = "0.8" }
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
proptest = "1"
